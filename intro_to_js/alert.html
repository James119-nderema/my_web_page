<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert</title>
</head>
<body>
    <p>Click the button to get an alert</p>
    <button onclick="alertMe()">Click Me</button>

    <script>
        function alertMe(){
            alert("This is an alert");
        }
    </script>
</body>
</html>
