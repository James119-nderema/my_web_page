<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>My Site</title>
  <link rel="icon" type="image/jpeg" href="public/school.jpeg">
 </head>
<body>

  <!-- Navbar stays permanently -->
  <nav>
    <img src="public/school.jpeg" alt="school Image" class="image_school">
    <a onclick="loadPage('pages/home.html', this)">Home</a>
    <a onclick="loadPage('pages/features.html', this)">Features</a>
    <a onclick="loadPage('pages/gallery.html', this)">Gallery</a>
    <a onclick="loadPage('pages/Register.html', this)" class="register">
        Register
    </a>
    <a onclick="loadPage('pages/login.html', this)" class="login">
        Login
    </a>
    
  </nav>

  <!-- Content from separate files loads here -->
  <div id="content">Loading...</div>

  <script>
    function loadPage(url, clickedLink) {
      // Update active state on navbar
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      clickedLink.classList.add('active');

      // Fetch the file and inject its content
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error('Page not found');
          return response.text();
        })
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(err => {
          document.getElementById('content').innerHTML = '<p>Error loading page.</p>';
          console.error(err);
        });
    }

    // Load home page by default on startup
    loadPage('pages/home.html', document.querySelector('nav a'));
  </script>

</body>
</html>
