<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <form class = register_form action="pages/landing_page.html">
        <legend>Register</legend>
        <label for="name"> Name:</label>
        <input type="text" id="name" name="name" required placeholder="James Nderema">
        <label for="email"> Email:</label>
        <input type="email" id="email" name="email" required placeholder="james.nderema@schoolmaster.co.ke">
        <label for="phone_number">Phone Number:</label>
        <input type="tel" id="phone_number" name="phone_number" required placeholder="+254706394482">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="password">
        <br>
        <button type="submit">Register</button>
        

        
    </form>
    
</body>
</html>
