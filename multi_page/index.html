<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: Arial, sans-serif; }

    nav {
      background-color: #333;
      display: flex;
      gap: 10px;
      padding: 15px 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    nav a:hover, nav a.active {
      background-color: #555;
    }

    #content {
      padding: 40px;
    }
  </style>
</head>
<body>

  <!-- Navbar stays permanently -->
  <nav>
    <a onclick="loadPage('pages/home.html', this)">Home</a>
    <a onclick="loadPage('pages/about.html', this)">About</a>
    <a onclick="loadPage('pages/contact.html', this)">Contact</a>
  </nav>

  <!-- Content from separate files loads here -->
  <div id="content">Loading...</div>

  <script>
    function loadPage(url, clickedLink) {
      // Update active state on navbar
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      clickedLink.classList.add('active');

      // Fetch the file and inject its content
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error('Page not found');
          return response.text();
        })
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(err => {
          document.getElementById('content').innerHTML = '<p>Error loading page.</p>';
          console.error(err);
        });
    }

    // Load home page by default on startup
    loadPage('pages/home.html', document.querySelector('nav a'));
  </script>

</body>
</html>
